[project]
name = "music-manager"
version = "0.4.0"
description = "Review new music, fix its tags and keep it in a Plex-ready library (Windows)."
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "mutagen>=1.47", "send2trash>=1.8"]

[project.gui-scripts]
music-manager = "music_manager.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
